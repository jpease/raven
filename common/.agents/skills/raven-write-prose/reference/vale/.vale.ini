StylesPath = styles
MinAlertLevel = suggestion

# Declared, not fetched. Nothing downloads until someone runs `vale sync` in
# this directory, and an unsynced package named here changes nothing.
#
# Naming one in `BasedOnStyles` is the opposite: Vale then refuses to run at
# all with "style does not exist on StylesPath". That is why the opt-in line
# below is commented and this one is not. A per-rule toggle is safe either
# way -- `write-good.Passive = YES` is inert until the package exists.
Packages = proselint, write-good, Readability

[*.md]
BasedOnStyles = Raven

# Passive voice is Orwell's rule 4, which no rule in this style covers and
# proselint does not either. Enabling the single rule avoids write-good's
# other seven, which are a poor fit (see below).
write-good.Passive = YES

# To turn proselint on: run `vale sync`, then swap the BasedOnStyles line
# above for this one. Do not uncomment before syncing. Do it in both sections
# or the code-comment half keeps the narrower rule set.
#
# BasedOnStyles = Raven, proselint

# Code comments and docstrings are prose, and `reference/genres.md` gives them
# two genre rows of their own. Without a section naming them, Vale reads a
# source file as empty: on a `.py` file carrying "utilize", "canonical" and
# "surface" it printed nothing and exited 0. A clean zero on unscanned input is
# the worst output a linter can give.
#
# Vale picks the comment syntax from the extension and reads module docstrings,
# function docstrings, line comments and block comments alike. Every extension
# below was checked against a fixture; add one only after doing the same, since
# an unhandled extension fails this same silent way.
#
# Keep this list covering every language template Raven ships. It did not:
# `lua` and `ex`/`exs` were both missing while `lua/` and `elixir/` templates
# shipped, so a consumer on either one had every comment in the repo unscanned
# and Vale exiting 0. Adding them turned up a real finding in the first Lua
# repo checked. Fixture used, seven findings per extension:
#   -- Utilize the canonical adjudication surfaces.
#   -- We will re-litigate the durable posture.
[*.{py,js,jsx,ts,tsx,rb,go,rs,swift,java,c,h,cpp,sh,lua,ex,exs}]
BasedOnStyles = Raven
write-good.Passive = YES

# Readability is a target, not a detector. Its rules are grade-level formulas
# over word, sentence, and syllable counts, and they track genre rather than
# authorship: measured here, technical docs ran Flesch-Kincaid 7.4 to 10.3
# whether an agent wrote them or not, while this author's essays ran 5.7 to
# 7.6. Do not read a high score as evidence about who wrote something.
#
# What it is good for is drift on one document over time. project_lifecycle.md
# moved from 7.8 to 9.2 across a year of edits, same genre and same author.
#
# Vale's default is FK < 8, which every essay measured here already meets.
# Add Readability.FleschKincaid to BasedOnStyles after syncing if you want it.

# Why proselint and not the alternatives, measured over 4,666 words of this
# repo's own guidance and a five-line sample of deliberate slop:
#
#   proselint    0 findings on clean prose, 9 on the slop. Cliches,
#                CorporateSpeak, Hedging, Jargon, Very, Uncomparables,
#                Archaisms -- the register problem exactly. BSD licensed.
#   write-good   147 on clean prose, 6 on the slop. E-Prime flags every form
#                of "to be"; TooWordy objects to `modify` and `equivalent`.
#                Only Passive earns its place.
#   Google       254 on clean prose, but Contractions 42, EmDash 35,
#   Microsoft    244, near-identical profile. Both are house style guides
#                that mandate contractions, dash policy, and sentence-case
#                headings. They enforce their voice over yours.
#   alex          23. Inconsiderate language -- a different axis, not this one.
#   Readability   22. Flesch metrics, informational only.

# Vendored third-party docs trip these rules and are not yours to rewrite.
# Exclude them by path. Measured case: a vendored database-skill reference
# used "Utilize" and failed the gate in a consumer repo.
# [**/vendor/**]
# BasedOnStyles = NONE

# Rules aimed at model register specifically rather than prose generally.
# Add to the Packages line above, then `vale sync`.
# https://github.com/tbhb/vale-ai-tells/releases/latest/download/AITells.zip
