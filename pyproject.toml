# Raven's runtime (scripts/raven.py + scripts/raven_lib/) is stdlib-only, so
# using Raven needs no dependencies. pytest is a development-only dependency for
# running this repo's own test suite -- Raven dogfoods the pytest default it
# ships in the python template. The documented contributor path is `uv run
# --group dev python -m pytest` (or `just test`, which wraps it); uv resolves
# and installs this group into a project-local venv automatically. Not using
# uv? Install the group into your own interpreter with
# `python -m pip install --group dev`, then override the launcher (see the
# justfile's `PYTHON` variable / `RAVEN_PYTHON` env var).
[dependency-groups]
dev = ["pytest"]

# No runtime package to build here -- this table exists so `uv run`/`uv lock`
# can resolve a `requires-python` floor instead of silently defaulting to the
# interpreter that happened to invoke uv (see `[tool.uv] package = false`
# below).
[project]
name = "raven"
version = "0"
requires-python = ">=3.9"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

# Raven's own development lint bar is intentionally stricter than the shipped
# python/ template. pyproject.toml is a starter tool config, so this root file
# diverges from the template permanently and is never clobbered by upgrade.
[tool.ruff.lint]
select = [
    "B",
    "BLE",
    "C4",
    "D",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "ISC",
    "PERF",
    "PGH",
    "PIE",
    "RET",
    "RUF",
    "SIM",
    "UP",
]
# Style-only rules that fight this codebase's existing docstring voice;
# the coverage rules (D100-D103) stay enforced.
ignore = ["D203", "D205", "D213", "D400", "D401", "D415"]

[tool.ruff.lint.per-file-ignores]
# __all__ is grouped by source module with comment headers, not sorted alphabetically.
"scripts/raven_lib/__init__.py" = ["RUF022"]
# Test names are the documentation (test_hooks_tolerate_malformed_json_stdin
# needs no docstring restating that). #153 scoped docstring coverage to
# shipped modules/hooks/scripts; a blanket sweep of ~940 test methods would be
# exactly the filler the issue's own quality bar warns against.
"tests/*.py" = ["D100", "D101", "D102", "D103"]

[tool.ruff.format]
# `.gitattributes` (#206) forces `eol=lf` at checkout for the shipped .py files
# under `.raven/git-hooks/lib/` -- checked for conflict with "auto" (preserve
# whatever line ending the file already has): none. `eol=lf` wins at the git
# layer before ruff ever opens the file, so a CRLF version of one of those
# files is not a state "auto" could ever observe and "preserve" here. Recorded
# so this is a considered non-decision, not a silent gap.
line-ending = "auto"
quote-style = "preserve"

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
# Reference-grade extra beyond "standard" (not full "strict", which floods on
# untyped-boundary unknowns): fail the build when a # type: ignore goes
# stale, so suppressions can't silently rot. (reportImplicitStringConcatenation
# was evaluated and rejected — it flags intentional multi-line string splits;
# ruff ISC already covers the accidental-concatenation bug class surgically.)
reportUnnecessaryTypeIgnoreComment = true
# Tests import the installer package from scripts/ after a sys.path insert.
extraPaths = ["scripts"]
# `just typecheck` invokes the standalone `pyright` binary directly, not
# through `uv run`, so it has no active VIRTUAL_ENV to inherit and needs an
# explicit pointer to the uv-managed dev venv -- otherwise a file that
# imports a dev-only dependency (e.g. `pytest` itself, in tests/conftest.py)
# reports a false reportMissingImports.
venvPath = "."
venv = ".venv"
