# Raven Codex project configuration for Python repositories.
# Project-local Codex config loads only after the project .codex layer is trusted.

[agents]
max_concurrent_threads_per_session = 4

[mcp_servers.semgrep]
command = "semgrep"
args = ["mcp"]

[mcp_servers.gitnexus]
command = "gitnexus"
args = ["mcp"]

[mcp_servers.lsp]
command = "mcp-language-server"
args = ["--workspace", ".", "--lsp", "pyright-langserver", "--", "--stdio"]
