StylesPath = styles
MinAlertLevel = suggestion

# Declared, not fetched. Nothing downloads until someone runs `vale sync` in
# this directory, and an unsynced package named here changes nothing.
#
# Naming one in `BasedOnStyles` is the opposite: Vale then refuses to run at
# all with "style does not exist on StylesPath". That is why the opt-in line
# below is commented and this one is not. A per-rule toggle is safe either
# way -- `write-good.Passive = YES` is inert until the package exists.
Packages = proselint, write-good

[*.md]
BasedOnStyles = Raven

# Passive voice is Orwell's rule 4, which no rule in this style covers and
# proselint does not either. Enabling the single rule avoids write-good's
# other seven, which are a poor fit (see below).
write-good.Passive = YES

# To turn proselint on: run `vale sync`, then swap the BasedOnStyles line
# above for this one. Do not uncomment before syncing.
#
# BasedOnStyles = Raven, proselint

# Why proselint and not the alternatives, measured over 4,666 words of this
# repo's own guidance and a five-line sample of deliberate slop:
#
#   proselint    0 findings on clean prose, 9 on the slop. Cliches,
#                CorporateSpeak, Hedging, Jargon, Very, Uncomparables,
#                Archaisms -- the register problem exactly. BSD licensed.
#   write-good   147 on clean prose, 6 on the slop. E-Prime flags every form
#                of "to be"; TooWordy objects to `modify` and `equivalent`.
#                Only Passive earns its place.
#   Google       254 on clean prose, but Contractions 42, EmDash 35,
#   Microsoft    244, near-identical profile. Both are house style guides
#                that mandate contractions, dash policy, and sentence-case
#                headings. They enforce their voice over yours.
#   alex          23. Inconsiderate language -- a different axis, not this one.
#   Readability   22. Flesch metrics, informational only.

# Vendored third-party docs trip these rules and are not yours to rewrite.
# Exclude them by path. Measured case: a vendored database-skill reference
# used "Utilize" and failed the gate in a consumer repo.
# [**/vendor/**]
# BasedOnStyles = NONE

# Rules aimed at model register specifically rather than prose generally.
# Add to the Packages line above, then `vale sync`.
# https://github.com/tbhb/vale-ai-tells/releases/latest/download/AITells.zip
